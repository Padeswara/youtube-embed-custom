<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Clean — Video preview</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="video-container">
      <section class="player-card" aria-label="Preview video YouTube">
        <div class="video-stage">
          <div class="video-window"><div id="player"></div></div>
          <div id="poster" class="video-poster" aria-hidden="true"><img width="1280" height="720" decoding="async" alt="" hidden /></div>
          <div id="loading" class="loading-indicator" aria-hidden="true" hidden></div>
          <button type="button" id="start-play" class="start-play" disabled aria-label="Putar video"><img id="start-icon" class="control-icon" src="./img/play.svg" width="18" height="18" alt="" draggable="false" /></button>
          <div class="control-bar" role="group" aria-label="Kontrol video">
          <input id="seek" class="seek-slider" type="range" min="0" max="0" step="0.1" value="0" aria-label="Posisi video" disabled />
          <div class="control-row">
          <button type="button" id="play" class="play-button" disabled aria-label="Putar video"><img id="play-icon" class="control-icon" src="./img/play.svg" width="18" height="18" alt="" draggable="false" /></button>
          <div class="volume-control">
            <button type="button" id="mute" class="mute-button" disabled aria-label="Aktifkan suara"><img id="sound-icon" class="control-icon" src="./img/volume-x.svg" width="18" height="18" alt="" draggable="false" /></button>
            <input id="volume" class="volume-slider" type="range" min="0" max="100" value="0" aria-label="Volume" disabled />
          </div>
          <span id="time" class="time-display">0:00 / 0:00</span>
          <select id="speed" aria-label="Kecepatan pemutaran" disabled><option value="1">1×</option></select>
          <button type="button" id="fullscreen" aria-label="Layar penuh"><img id="fullscreen-icon" class="control-icon" src="./img/maximize.svg" width="18" height="18" alt="" draggable="false" /></button>
          </div>
          </div>
        </div>
      </section>
      <span id="status" class="visually-hidden" role="status" aria-live="polite">Memuat video…</span>
    </div>
  </body>
</html>
